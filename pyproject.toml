[project]
name = "gitlab_groupsync"
version = "0.2.0"
description = "Synchronize selected GitLab group repositories, wikis, and work items for offline reference search."
authors = [
    { name = "Josef Nevrly", email = "josef.nevrly@gmail.com" }
]
license = { text = "MIT license" }
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    
    
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.7,<9.0.0",
    "httpx>=0.28,<1.0",
    "onacol>=0.3.5,<0.4.0",
    "ruamel-yaml>=0.17.40,<0.18.0",
]

[project.urls]
Homepage = "https://github.com/calcite/gitlab-groupsync"
Repository = "https://github.com/calcite/gitlab-groupsync"


[project.scripts]
gl-groupsync = "gitlab_groupsync.cli:main"


[dependency-groups]
dev = [
    "tox>=4.34.0,<5.0.0",
    "coverage[toml]>=7.4,<8.0.0",
    "ruff>=0.14.0,<0.15.0",

    "pytest>=9.0,<10.0.0",
    "pytest-cov>=4.1,<5.0.0",

    "mypy>=1.19,<2.0.0",
]

[tool.coverage.run]
omit = [".*", "*/site-packages/*"]
source = ["gitlab_groupsync"]
relative_files = true

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.pytest.ini_options]
markers = [
    "live: explicitly configured read-only tests against a disposable GitLab instance",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitlab_groupsync"]

[tool.hatch.build.targets.sdist]
include = [
    "/gitlab_groupsync",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
