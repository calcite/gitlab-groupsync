name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Python distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Install Python and system dependencies
        run: |
          uv python install 3.13
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git git-lfs openssh-client

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Check release metadata and tag
        run: uv run --frozen python scripts/check_release.py

      - name: Lint, format and type checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy gitlab_groupsync
          uvx --from actionlint-py==1.7.12.25 actionlint

      - name: Test with required coverage
        run: uv run --frozen pytest --cov=gitlab_groupsync --cov-report=term-missing tests/

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Validate distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Smoke-test isolated wheel and source installations
        run: |
          version=$(uv run --frozen python -c 'import gitlab_groupsync; print(gitlab_groupsync.__version__)')
          for distribution in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$distribution" \
              python scripts/smoke_distribution.py "$version"
          done

      - name: Upload tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
